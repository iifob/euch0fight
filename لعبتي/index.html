<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1024">
<link rel="icon" type="image/webp" href="/logo.webp">
<link rel="apple-touch-icon" href="/logo.webp">
<title>Euch Fight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800;1,900&family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;700;800&display=swap">
<style>
/* Layout: full-screen 3D arena; navy-glass menus centred over a slowly orbiting map; HUD pinned to the edges; touch pads in the bottom corners */
:root{
  --navy:#0b1024; --glass:rgba(11,16,36,.84); --glass2:rgba(20,28,58,.9); --chrome:#e9ecf5; --steel:#9aa4c2; --line:rgba(233,236,245,.16);
  --accent:#8fb2ff; --gold:#e8c46a; --warn:#ffd166; --bad:#ff5d5d; --ok:#5fd39a;
  --latin:"Exo 2","Tajawal",system-ui,sans-serif; --kufi:"Reem Kufi","Tajawal",system-ui,sans-serif; --body:"Tajawal",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--navy);color:var(--chrome);font-family:var(--body)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;display:block;width:100%;height:100%}
#touchLayer{position:fixed;inset:0;z-index:2}
button{font-family:var(--body)}
.screen{position:fixed;inset:0;display:flex;justify-content:center;align-items:flex-start;padding:12px 16px;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);background:radial-gradient(ellipse at center,rgba(11,16,36,.25),rgba(11,16,36,.82));z-index:6;overflow:auto}
.card{margin-block:auto;width:min(760px,100%);background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;direction:rtl;text-align:right;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card.narrow{width:min(440px,100%)}
#logo{width:min(330px,70vw);height:auto;display:block;margin:0 auto;filter:drop-shadow(0 8px 22px rgba(0,0,0,.55))}
.mainGrid{display:grid;grid-template-columns:1fr 1.25fr;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
label,.lbl{font-size:13px;opacity:.75;font-weight:700}
input[type=text]{width:100%;font:700 17px var(--body);padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(233,236,245,.07);color:var(--chrome);direction:rtl;user-select:text;-webkit-user-select:text}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw[aria-pressed=true]{border-color:var(--chrome);transform:scale(1.1)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{border:1px solid var(--line);background:rgba(233,236,245,.05);border-radius:14px;padding:10px 12px;cursor:pointer;color:var(--chrome);text-align:right;display:flex;flex-direction:column;gap:2px}
.mode b{font:700 18px var(--kufi)}
.mode span{font-size:12px;opacity:.7;line-height:1.4}
.mode[aria-pressed=true]{border-color:var(--gold);background:linear-gradient(180deg,rgba(232,196,106,.18),rgba(232,196,106,.04));box-shadow:inset 0 0 0 1px var(--gold)}
.btn{font:800 18px var(--body);padding:12px 16px;border-radius:12px;border:0;cursor:pointer;color:var(--navy);background:linear-gradient(180deg,#ffffff,#b8c0d8);box-shadow:0 3px 0 #555f7c;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #555f7c}
.btn.gold{background:linear-gradient(180deg,#ffe6a3,#d6a845);box-shadow:0 3px 0 #8a6420}
.btn.alt{background:linear-gradient(180deg,#9fbcff,#5878cf);color:#fff;box-shadow:0 3px 0 #2c4185}
.btn.ghost{background:transparent;color:var(--chrome);box-shadow:none;border:1px solid var(--line);font-size:16px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}.row>*{min-width:0}
.note{font-size:13px;opacity:.75;line-height:1.7;margin:0}
.err{color:var(--warn);font-weight:700;font-size:14px;margin:0}
kbd{font:700 12px var(--body);background:rgba(233,236,245,.12);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
h2{font:700 28px var(--kufi);margin:0;text-align:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{flex:1;min-width:80px;padding:9px 8px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--chrome);font:800 15px var(--body);cursor:pointer}
.tab[aria-selected=true]{background:var(--chrome);color:var(--navy)}
.setList{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow:auto;padding-left:4px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line)}
.set .name{font-weight:700;font-size:15px}
.set .ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--chrome);padding:7px 11px;font:700 14px var(--body);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--navy)}
.tog{width:52px;height:30px;border-radius:999px;border:1px solid var(--line);background:rgba(233,236,245,.12);position:relative;cursor:pointer}
.tog::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:var(--chrome);transition:right .15s}
.tog[aria-checked=true]{background:var(--ok)}
.tog[aria-checked=true]::after{right:25px}
input[type=range]{width:min(200px,38vw);accent-color:var(--accent)}
.val{font-variant-numeric:tabular-nums;min-width:44px;text-align:center;font-weight:800;font-size:14px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;padding:8px 2px}
.hud{position:fixed;z-index:3;pointer-events:none}
#top{top:calc(env(safe-area-inset-top,0px) + 8px);left:0;right:0;display:flex;justify-content:center;gap:6px;direction:rtl;flex-wrap:wrap;padding:0 110px}
.chip{background:var(--glass);border-radius:999px;padding:4px 12px 4px 9px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.chip.me{box-shadow:inset 0 0 0 1px var(--gold)}
.pips{display:flex;gap:3px}.pip{width:8px;height:8px;border-radius:2px;background:rgba(233,236,245,.2)}.pip.on{background:var(--gold)}
.bar{width:60px;height:6px;border-radius:3px;background:rgba(233,236,245,.18);overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.dot{width:11px;height:11px;border-radius:50%}
#menuBtn{position:fixed;z-index:4;top:calc(env(safe-area-inset-top,0px) + 8px);left:calc(env(safe-area-inset-left,0px) + 10px);font:800 14px var(--body);background:var(--glass);color:var(--chrome);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
#roomTag{top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);background:var(--glass);border-radius:999px;padding:4px 11px;font-weight:800;font-size:13px}
#fps{top:calc(env(safe-area-inset-top,0px) + 44px);left:calc(env(safe-area-inset-left,0px) + 12px);font:800 12px var(--latin);opacity:.8}
#cross{left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%)}
#cross i{position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
#cross i:nth-child(1){left:12px;top:0;width:2px;height:8px}#cross i:nth-child(2){left:12px;bottom:0;width:2px;height:8px}#cross i:nth-child(3){top:12px;left:0;height:2px;width:8px}#cross i:nth-child(4){top:12px;right:0;height:2px;width:8px}
#charge{left:50%;top:calc(50% + 24px);width:70px;height:5px;transform:translateX(-50%);background:rgba(0,0,0,.35);border-radius:3px;overflow:hidden}
#charge i{display:block;height:100%;width:0;background:var(--gold)}
#hitm{left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%) rotate(45deg);opacity:0}
#hitm::before,#hitm::after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
#hitm.kill{transform:translate(-50%,-50%) rotate(45deg) scale(1.45)}#hitm.kill::before,#hitm.kill::after{background:var(--bad)}
#hitm::before{left:14px;top:0;width:2px;height:30px}#hitm::after{top:14px;left:0;height:2px;width:30px}
#red{inset:0;opacity:0;box-shadow:inset 0 0 160px 40px rgba(220,30,30,.7)}
#lowhp{inset:0;opacity:0;box-shadow:inset 0 0 180px 60px rgba(200,0,0,.75)}
#smoke{inset:0;opacity:0;background:radial-gradient(ellipse at center,rgba(220,214,200,.92),rgba(190,182,166,.97))}
#dash{inset:0;opacity:0;box-shadow:inset 0 0 120px 30px rgba(143,178,255,.55)}
#dmgDirs{left:50%;top:50%;width:0;height:0}
#dmgDirs i{position:absolute;left:-14px;top:-130px;width:28px;height:14px;background:var(--bad);clip-path:polygon(50% 0,100% 100%,0 100%);transform-origin:14px 130px}
#hpBox{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 16px);display:flex;flex-direction:column;gap:6px;align-items:flex-end;direction:rtl}
#hpNum{font:900 italic 32px var(--latin);font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.4);line-height:1}
#hpBar{width:150px;height:8px;border-radius:4px;background:rgba(0,0,0,.4);overflow:hidden}#hpBar i{display:block;height:100%;background:var(--ok);transition:width .15s}
#abil{display:flex;gap:8px}
.ab{width:42px;height:42px;border-radius:50%;background:var(--glass);display:flex;align-items:center;justify-content:center;font:800 11px var(--body);position:relative;overflow:hidden}
.ab i{position:absolute;inset:0;background:rgba(0,0,0,.55);transform-origin:bottom}
.ab span{position:relative}
#ammo{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);background:var(--glass);border-radius:999px;padding:6px 16px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;direction:rtl}
#msg{left:0;right:0;top:26%;text-align:center;font:700 44px var(--kufi);text-shadow:0 3px 0 rgba(0,0,0,.45);direction:rtl}
#msg small{display:block;font:800 17px var(--body);margin-top:6px}
#feed{top:calc(env(safe-area-inset-top,0px) + 42px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;flex-direction:column;gap:4px;direction:rtl;align-items:flex-end}
#feed div{background:var(--glass);border-radius:8px;padding:3px 10px;font-size:13px;font-weight:700;animation:fade 4s forwards}
#feed div.mine{box-shadow:inset 0 0 0 1px var(--gold)}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
#nums{inset:0}
#nums b{position:absolute;font:900 italic 18px var(--latin);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6);transform:translate(-50%,-50%)}
#nums b.head{color:var(--warn);font-size:22px}
.tb{position:fixed;z-index:4;border-radius:50%;background:rgba(233,236,245,.14);border:2px solid rgba(233,236,245,.35);color:var(--chrome);font:800 13px var(--body);display:flex;align-items:center;justify-content:center;touch-action:none;text-align:center;line-height:1.1}
.tb.on{background:rgba(143,178,255,.45);border-color:var(--accent)}
#stick{position:fixed;z-index:3;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(233,236,245,.35);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(233,236,245,.4)}
.pvBox{position:relative;border-radius:16px;background:radial-gradient(ellipse at 50% 70%,rgba(143,178,255,.22),rgba(11,16,36,0) 70%);border:1px solid var(--line);overflow:hidden}
#pv{display:block;width:100%;height:220px;touch-action:none;cursor:grab}
.pvEm{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.pvEm button,#emoBar button{border:1px solid var(--line);background:var(--glass2);color:var(--chrome);border-radius:999px;padding:4px 10px;font:800 12px var(--body);cursor:pointer}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg2 button{border:1px solid var(--line);background:rgba(233,236,245,.05);color:var(--chrome);border-radius:12px;padding:9px;font:700 16px var(--kufi);cursor:pointer}
.seg2 button[aria-pressed=true]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:rgba(232,196,106,.16)}
.skins{display:flex;gap:6px;flex-wrap:wrap}
.skins button{border:1px solid var(--line);background:rgba(233,236,245,.05);color:var(--chrome);border-radius:10px;padding:6px 10px;font:700 13px var(--kufi);cursor:pointer}
.skins button[aria-pressed=true]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:rgba(232,196,106,.14)}
#emoBar{position:fixed;z-index:5;right:calc(env(safe-area-inset-right,0px) + 76px);bottom:calc(env(safe-area-inset-bottom,0px) + 196px);display:flex;flex-direction:column;gap:6px}
#emoBar button{padding:8px 14px;font-size:14px}
.mini{border:1px solid var(--line);background:rgba(233,236,245,.08);color:var(--chrome);border-radius:8px;padding:5px 10px;font:700 13px var(--body);cursor:pointer}
.devIn{font:700 15px var(--body);padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(233,236,245,.07);color:var(--chrome);min-width:0;user-select:text;-webkit-user-select:text}
.statGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(233,236,245,.06);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;display:flex;flex-direction:column}
.stat b{font:900 italic 26px var(--latin);font-variant-numeric:tabular-nums}.stat span{font-size:12px;opacity:.75}
#statsBody h3{font:700 18px var(--kufi);margin:10px 0 2px}
.vsRow{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:15px}
.achGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ach{border:1px solid var(--line);border-radius:10px;padding:7px 9px;display:flex;flex-direction:column;opacity:.5}.ach.on{opacity:1;border-color:var(--gold);background:rgba(232,196,106,.1)}
.ach b{font-size:14px}.ach span{font-size:12px;opacity:.75}
#toast{position:fixed;z-index:8;top:calc(env(safe-area-inset-top,0px) + 54px);left:50%;transform:translateX(-50%);background:var(--glass2);border:1px solid var(--gold);border-radius:14px;padding:9px 16px;display:flex;flex-direction:column;align-items:center;direction:rtl;pointer-events:none}
#res{top:calc(env(safe-area-inset-top,0px) + 70px);left:calc(env(safe-area-inset-left,0px) + 10px);display:flex;flex-direction:column;gap:4px;direction:rtl}
.rc{background:var(--glass);border-radius:10px;padding:3px 9px;display:flex;flex-direction:column;align-items:flex-start;min-width:74px}.rc b{font:800 14px var(--body);font-variant-numeric:tabular-nums}.rc span{font-size:10px;opacity:.75}.rc.lock{opacity:.55}
#buildBar{position:fixed;z-index:5;bottom:calc(env(safe-area-inset-bottom,0px) + 54px);left:50%;transform:translateX(-50%);display:flex;gap:6px;direction:rtl;flex-wrap:wrap;justify-content:center}
#buildBar button{border:1px solid var(--line);background:var(--glass2);color:var(--chrome);border-radius:10px;padding:6px 10px;font:800 13px var(--body);cursor:pointer;touch-action:none}#buildBar button[aria-pressed=true]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:rgba(232,196,106,.2)}
#shopBody h3{font:700 17px var(--kufi);margin:10px 0 2px}
#toast b{font:700 16px var(--kufi)}#toast span{font-size:12px;opacity:.8}
#toast.show{animation:toastIn 3.6s forwards}@keyframes toastIn{0%{opacity:0;transform:translate(-50%,-10px)}8%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
#rotate{position:fixed;inset:0;z-index:9;background:var(--navy);display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font:700 22px var(--kufi);direction:rtl;line-height:1.6}
@media (orientation:portrait) and (pointer:coarse){#rotate.need{display:flex}}
@media (max-width:700px){.mainGrid{grid-template-columns:1fr}}
@media (max-height:520px){#pv{height:150px}.card{gap:8px;padding:12px 14px}#logo{width:200px}.mode{padding:7px 10px}.mode b{font-size:15px}.mode span{display:none}.btn{padding:9px 14px;font-size:16px}.sw{width:28px;height:28px}.setList{max-height:46vh}#msg{font-size:34px}}
@media (prefers-reduced-motion:reduce){.btn,.tog::after{transition:none}#feed div{animation:none}}

(()=>{
// ---------- link to our own game server (rooms + developer storage) ----------
const LINK={ws:null,ready:null,id:null,n:0,wait:{},room:null,roomH:[],subs:{},auth:''};
function linkUrl(){if(!/^https?:$/.test(location.protocol))return null;return (location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';}
function linkSend(o){if(LINK.ws&&LINK.ws.readyState===1){try{LINK.ws.send(typeof o==='string'?o:JSON.stringify(o));return true;}catch(e){}}return false;}
function linkOpen(){if(LINK.ready)return LINK.ready;const url=linkUrl();if(!url)return Promise.resolve(false);
 LINK.ready=new Promise(res=>{let done=false,ws;const fin=v=>{if(!done){done=true;clearTimeout(to);res(v);}};
  try{ws=new WebSocket(url);}catch(e){LINK.ready=null;res(false);return;}
  const to=setTimeout(()=>{LINK.ready=null;try{ws.close();}catch(e){}fin(false);},70000);
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}
   if(m.t==='hello'){LINK.id=m.id;LINK.ws=ws;if(LINK.room)linkSend({t:'join',room:LINK.room});for(const p in LINK.subs)linkSend({t:'sub',path:p});fin(true);return;}
   linkMsg(m);};
  ws.onclose=()=>{const was=LINK.ws===ws;if(was){LINK.ws=null;LINK.ready=null;}for(const k in LINK.wait){LINK.wait[k]({err:'closed'});delete LINK.wait[k];}
   if(!done){LINK.ready=null;fin(false);return;}
   if(was&&(LINK.room||Object.keys(LINK.subs).length))setTimeout(()=>linkOpen(),2000);};});
 return LINK.ready;}
function linkReq(o){return new Promise(res=>{const id=++LINK.n;o.id=id;LINK.wait[id]=res;if(!linkSend(o)){delete LINK.wait[id];res({err:'offline'});}setTimeout(()=>{if(LINK.wait[id]){delete LINK.wait[id];res({err:'timeout'});}},20000);});}
function linkFire(ch){for(const h of LINK.roomH){try{h(ch);}catch(e){console.warn(e);}}}
const mapPeer=p=>({peer:p.peer,presence:p.presence||{},sameTab:p.peer===LINK.id});
function linkMsg(m){
 if(m.t==='res'){const w=LINK.wait[m.id];if(w){delete LINK.wait[m.id];w(m);}return;}
 if(m.t==='joined'||m.t==='full'){const w=LINK.joinW;if(w){LINK.joinW=null;w(m.t);}return;}
 if(m.t==='peers'){linkFire({peers:(m.peers||[]).map(mapPeer),joined:(m.joined||[]).map(mapPeer),left:(m.left||[]).map(mapPeer)});return;}
 if(m.t==='pres'){linkFire({peers:[{peer:m.peer,presence:m.p||{},sameTab:false}],joined:[],left:[]});return;}
 if(m.t==='snap'){const hs=LINK.subs[m.path];if(hs)for(const h of hs){try{h(m.data);}catch(e){}}}}

  const r=await new Promise(res=>{LINK.joinW=res;LINK.room=name;linkSend({t:'join',room:name});setTimeout(()=>{if(LINK.joinW===res){LINK.joinW=null;res('timeout');}},20000);});

  onSnapshot(cb){(LINK.subs[path]=LINK.subs[path]||[]).push(d=>cb(snapOf(d)));linkSend({t:'sub',path});return()=>{};}};},

}

const MATS={};
function M(key){
 if(MATS[key])return MATS[key];let m;
 if(key.startsWith('c:')){const p=key.split(':');m=new T.MeshStandardMaterial({color:p[1],roughness:p[2]!=null?+p[2]:.85,metalness:p[3]!=null?+p[3]:0});}
 else if(key==='metal')m=new T.MeshStandardMaterial({color:'#b9bec8',roughness:.32,metalness:.85});
 else if(key==='darkMetal')m=new T.MeshStandardMaterial({color:'#3b3e45',roughness:.45,metalness:.7});
 else if(key==='gold')m=new T.MeshStandardMaterial({color:'#d4a63a',roughness:.35,metalness:.9});
 else if(key==='leaf')m=new T.MeshStandardMaterial({color:'#4f8a3a',roughness:.8,side:T.DoubleSide});
 else if(key==='palm')m=new T.MeshStandardMaterial({color:'#5c8f3a',roughness:.8,side:T.DoubleSide});
 else if(key==='pink')m=new T.MeshStandardMaterial({color:'#f2a7c3',roughness:.85,flatShading:true});
 else if(key==='pine')m=new T.MeshStandardMaterial({color:'#2f5a35',roughness:.9,flatShading:true});
 else if(key==='water')m=new T.MeshStandardMaterial({color:'#3d6f86',roughness:.15,metalness:.2,transparent:true,opacity:.85});
 else if(key==='flame')m=new T.MeshBasicMaterial({color:'#ffb347',transparent:true,opacity:.9,blending:T.AdditiveBlending,depthWrite:false});
 else if(key==='glow')m=new T.MeshBasicMaterial({color:'#ffe6a3',transparent:true,opacity:.75,blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide});
 else if(TEXDEF[key]){m=new T.MeshStandardMaterial({map:canvasTex(key,TEXDEF[key]),roughness:key==='marble'?.5:.92,metalness:0});}
 else m=new T.MeshStandardMaterial({color:'#ff00ff'});
 MATS[key]=m;return m;
}
// box with world-scaled UVs
function boxGeo(sx,sy,sz,tile){tile=tile||4;const g=new T.BoxGeometry(sx,sy,sz);const uv=g.attributes.uv;const d=[[sz,sy],[sz,sy],[sx,sz],[sx,sz],[sx,sy],[sx,sy]];for(let f=0;f<6;f++)for(let v=0;v<4;v++){const i=f*4+v;uv.setXY(i,uv.getX(i)*d[f][0]/tile,uv.getY(i)*d[f][1]/tile);}return g;}
let logoTex=null;
function getLogoTex(){if(!logoTex){logoTex=new T.TextureLoader().load($('#serverLogo').src);logoTex.encoding=T.sRGBEncoding;}return logoTex;}

function addMesh(geo,mat,x,y,z,opt){const m=new T.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=!(opt&&opt.noShadow);m.receiveShadow=true;world.add(m);return m;}
function col(x0,y0,z0,x1,y1,z1){colliders.push({min:{x:x0,y:y0,z:z0},max:{x:x1,y:y1,z:z1}});}
const RB={};
function roundGeo(sx,sy,sz,tile){tile=tile||4;const r=Math.min(.32,Math.min(sx,sy,sz)*.2);const key=[sx,sy,sz,tile].map(v=>v.toFixed(3)).join('|');if(RB[key])return RB[key];
 if(r<.05||!T.ExtrudeGeometry||!T.Shape)return RB[key]=boxGeo(sx,sy,sz,tile);
 const bs=r*.85,bt=r*.85,w=sx/2-bs,d=sz/2-bs,cr=Math.min(r*.6,w*.9,d*.9);const sh=new T.Shape();
 sh.moveTo(-w+cr,-d);sh.lineTo(w-cr,-d);sh.quadraticCurveTo(w,-d,w,-d+cr);sh.lineTo(w,d-cr);sh.quadraticCurveTo(w,d,w-cr,d);sh.lineTo(-w+cr,d);sh.quadraticCurveTo(-w,d,-w,d-cr);sh.lineTo(-w,-d+cr);sh.quadraticCurveTo(-w,-d,-w+cr,-d);
 const g=new T.ExtrudeGeometry(sh,{depth:Math.max(.01,sy-2*bt),bevelEnabled:true,bevelThickness:bt,bevelSize:bs,bevelSegments:2,curveSegments:3});
 g.rotateX(-Math.PI/2);g.translate(0,-(sy-2*bt)/2,0);const uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)/tile,uv.getY(i)/tile);g.computeVertexNormals();
 return RB[key]=g;}
function solid(x,y,z,sx,sy,sz,mk,opt){opt=opt||{};const m=addMesh(opt.sharp?boxGeo(sx,sy,sz,opt.tile):roundGeo(sx,sy,sz,opt.tile),typeof mk==='string'?M(mk):mk,x,y,z,opt);if(!opt.noCol)col(x-sx/2,y-sy/2,z-sz/2,x+sx/2,y+sy/2,z+sz/2);return m;}
function slab(x0,z0,x1,z1,top,th,mk,opt){return solid((x0+x1)/2,top-th/2,(z0+z1)/2,x1-x0,th,z1-z0,mk,opt);}
function steps(x,z,dx,dz,width,base,top,mk){const n=Math.round((top-base)/.5);for(let i=0;i<n;i++){const t=base+(i+1)*.5,h=t-base+.5;const cx=x+dx*(i+.5),cz=z+dz*(i+.5);solid(dx?cx:x,t-h/2,dz?cz:z,dx?1:width,h,dz?1:width,mk,{tile:2});}}
function cylUV(g,r,h){const uv=g.attributes.uv;const circ=Math.PI*2*r/4;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*circ,uv.getY(i)*h/4);return g;}
function tower(x,z,r,h,mk,opt){opt=opt||{};const b=opt.base||0;const g=cylUV(new T.CylinderGeometry(r*(opt.taper||1),r,h,24,1),r,h);addMesh(g,M(mk),x,b+h/2,z);if(!opt.noCol){const c=r*.78;col(x-c,b,z-c,x+c,b+h,z+c);}return g;}
function crenels(x0,z0,x1,z1,y,mk,sz){sz=sz||.7;const L=Math.hypot(x1-x0,z1-z0),n=Math.max(1,Math.floor(L/1.3));for(let i=0;i<=n;i++){const t=i/n;solid(lerp(x0,x1,t),y+sz/2,lerp(z0,z1,t),sz,sz,sz,mk,{noCol:1,tile:2});}}
function crenelRing(x,z,r,y,mk){const n=Math.floor(Math.PI*2*r/1.3);for(let i=0;i<n;i++){const a=i/n*Math.PI*2;solid(x+Math.cos(a)*(r-.3),y+.35,z+Math.sin(a)*(r-.3),.6,.7,.6,mk,{noCol:1,tile:2});}}

function platform(cx,cz,w,d,h,mk,side,base){base=base||0;slab(cx-w/2,cz-d/2,cx+w/2,cz+d/2,base+h,h,mk,{tile:2});const n=Math.round(h/.5);
 if(side==='+x')steps(cx+w/2+n,cz,-1,0,1.6,base,base+h,mk);else if(side==='-x')steps(cx-w/2-n,cz,1,0,1.6,base,base+h,mk);else if(side==='+z')steps(cx,cz+d/2+n,0,-1,1.6,base,base+h,mk);else steps(cx,cz-d/2-n,0,1,1.6,base,base+h,mk);}

function eraOf(i){return MAPS[i].era;}
function disposeGroup(g){g.traverse(o=>{if(o.geometry)o.geometry.dispose();});}
function buildMap(i){
 if(world){scene.remove(world);disposeGroup(world);}
 world=new T.Group();colliders=[];ambient=[];petals=null;curMap=MAPS[i];curEra=curMap.era;musEra=curEra;
 const p=curMap.pal;skyMat.uniforms.top.value.set(p.top);skyMat.uniforms.hor.value.set(p.hor);skyMat.uniforms.bot.value.set(p.bot);skyMat.uniforms.sunCol.value.set(p.sunCol);
 const sd=new T.Vector3(...p.sun).normalize();skyMat.uniforms.sunDir.value.copy(sd);
 scene.fog.color.set(p.fog);hemi.color.set(p.hs);hemi.groundColor.set(p.hg);hemi.intensity=p.hi;sun.color.set(p.sc);sun.intensity=p.si;
 vmHemi.color.set(p.hs);vmHemi.groundColor.set(p.hg);
 sun.position.copy(sd).multiplyScalar(100);sun.target.position.set(0,0,0);
 curMap.build();
 if(EXTRA[curMap.id==='arabia'?'arabia':curMap.id])EXTRA[curMap.id]();
 // spread the whole map out horizontally (heights, stairs and jumps stay the same)
 if(!curMap.noScale){world.scale.set(MAP_K,1,MAP_K);for(const c of colliders){c.min.x*=MAP_K;c.max.x*=MAP_K;c.min.z*=MAP_K;c.max.z*=MAP_K;}}
 mergeStatic();
 scene.add(world);
 buildFun();
}
// merge static meshes per material to cut draw calls (keeps the phone smooth)
function mergeStatic(){
 if(!T.BufferGeometry.prototype.toNonIndexed)return;
 try{
  world.updateMatrixWorld(true);
  const dyn=new Set();for(const a of ambient)a.m.traverse(o=>dyn.add(o));
  const groups=new Map(),kill=[];const inv=world.matrixWorld.clone().invert(),rel=new T.Matrix4();
  world.traverse(o=>{if(!o.isMesh||o.isInstancedMesh||dyn.has(o)||!o.geometry||!o.geometry.attributes.uv||!o.geometry.attributes.normal||Array.isArray(o.material))return;
   const key=o.material.uuid+(o.castShadow?'|s':'');if(!groups.has(key))groups.set(key,{mat:o.material,cast:o.castShadow,geos:[]});
   const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();g.applyMatrix4(rel.copy(inv).multiply(o.matrixWorld));groups.get(key).geos.push(g);kill.push(o);});
  const made=[];
  for(const {mat,cast,geos} of groups.values()){let n=0;for(const g of geos)n+=g.attributes.position.count;
   const pos=new Float32Array(n*3),nor=new Float32Array(n*3),uv=new Float32Array(n*2);let off=0;
   for(const g of geos){pos.set(g.attributes.position.array,off*3);nor.set(g.attributes.normal.array,off*3);uv.set(g.attributes.uv.array,off*2);off+=g.attributes.position.count;g.dispose();}

// ---------- ray & targets ----------
function rayBox(o,d,mn,mx){let t0=0,t1=1e9;for(const a of ['x','y','z']){const dv=d[a]||1e-9,inv=1/dv;let ta=(mn[a]-o[a])*inv,tb=(mx[a]-o[a])*inv;if(ta>tb){const q=ta;ta=tb;tb=q;}if(ta>t0)t0=ta;if(tb<t1)t1=tb;if(t1<t0)return -1;}return t0;}
function worldT(o,d,max){let t=max;for(const b of colliders){const h=rayBox(o,d,b.min,b.max);if(h>=0&&h<t)t=h;}return t;}
function pointSolid(p){for(const b of colliders)if(p.x>b.min.x&&p.x<b.max.x&&p.y>b.min.y&&p.y<b.max.y&&p.z>b.min.z&&p.z<b.max.z)return true;return false;}
function targets(){
 const out=[];
 for(const e of ents)if(e.alive)out.push({kind:'ent',ref:e,id:e.id,pos:e.p,r:.4,h:1.55,head:true});
 for(const k in remotes){const r=remotes[k];if(r.ok&&r.alive)out.push({kind:'remote',ref:r,id:r.id,pos:r.rp,r:.4,h:1.55,head:true});}
 for(const z of zombies)if(z.alive)out.push({kind:z.remote?'rzombie':'zombie',ref:z,id:'z'+z.id,pos:z.remote?z.rp:z.p,r:.42,h:1.55,head:true});
 for(const b of barrels)if(b.alive)out.push({kind:'barrel',ref:b,id:'b'+b.id,pos:b.pos,r:.5,h:1.15,head:false});
 for(const b of balls)out.push({kind:'ball',ref:b,id:'ball'+b.id,pos:new T.Vector3(b.p.x,b.p.y-b.r,b.p.z),r:b.r*.85,h:b.r*2,head:false});
 eggTargets(out);
 return out;
}
function boxesOf(t){if(t.box)return [{mn:t.box.mn,mx:t.box.mx,head:false}];const p=t.pos;const out=[{mn:{x:p.x-t.r,y:p.y,z:p.z-t.r},mx:{x:p.x+t.r,y:p.y+t.h,z:p.z+t.r},head:false}];if(t.head)out.push({mn:{x:p.x-.25,y:p.y+t.h,z:p.z-.25},mx:{x:p.x+.25,y:p.y+t.h+.5,z:p.z+.25},head:true});return out;}

// ---------- damage pipeline ----------
let hitMarkT=0,killMarkT=0;
function dealDamage(t,dmg,dir,kb,by,head,extra){
 if(typeof by==='string'&&by.startsWith('bot'))dmg*=(DIFF[S.botDiff]||DIFF.med).dmg;
 dmg=Math.round(dmg);if(dmg<=0&&!(kb>0))return;
 if(mode==='eggwar'&&eggDamage(t,dmg,dir,kb,by))return;
 if(t.kind==='ball'){kickBall(t.ref,dir,kb||4);return;}
 if(by===myId()&&t.kind!=='barrel'&&dmg>0){hitMarkT=.15;sfx('marker');sfx('thud');if(S.shake)shakeT=Math.max(shakeT,.06);showDmgNum(t,dmg,head);}
 if(t.kind==='ent')hurt(t.ref,dmg,dir,kb,by);
 else if(t.kind==='remote'){myHits.push(extra?[++hitN,t.id,dmg,+(dir.x*kb).toFixed(1),+(dir.z*kb).toFixed(1),extra]:[++hitN,t.id,dmg,+(dir.x*kb).toFixed(1),+(dir.z*kb).toFixed(1)]);t.ref.flash=.2;}
 else if(t.kind==='zombie')hurtZombie(t.ref,dmg,dir,kb,by);
 else if(t.kind==='rzombie'){myHits.push([++hitN,t.id,dmg,+(dir.x*kb).toFixed(1),+(dir.z*kb).toFixed(1)]);}
 else if(t.kind==='barrel')explodeBarrel(t.ref,by,true);
}
let dmgNums=[];

// ---------- projectiles ----------
let projs=[],projN=0;
function spawnProj(o){
 const mesh=projModel(o.model,o.era||curEra);mesh.traverse(m=>{m.castShadow=false;});scene.add(mesh);
 const pr=Object.assign({id:++projN,life:7,stuck:0,mesh,spin:0},o);pr.p=o.p.clone();pr.v=o.v.clone();projs.push(pr);updProjMesh(pr,0);return pr;}
function updProjMesh(pr,dt){pr.mesh.position.copy(pr.p);if(!pr.stuck){const look=pr.p.clone().sub(pr.v);pr.mesh.lookAt(look);if(pr.spinning){pr.spin+=dt*18;pr.mesh.rotateX(pr.spin);}}}
function updProjs(dt){
 const tg=targets();
 const kill=(i,pr)=>{scene.remove(pr.mesh);projs.splice(i,1);};
 for(let i=projs.length-1;i>=0;i--){const pr=projs[i];pr.life-=dt;
  if(pr.stuck){pr.stuck-=dt;if(pr.stuck<=0||pr.life<=0)kill(i,pr);continue;}
  const sp_=PROJ_FLAGS[pr.kind];
  if(sp_){const r=specialProjTick(pr,dt);if(r==='remove'){kill(i,pr);continue;}}
  pr.v.y-=pr.grav*dt;const sp=pr.v.length();const n=Math.max(1,Math.ceil(sp*dt/.35));let done=false;
  for(let s=0;s<n&&!done;s++){const h=dt/n;pr.p.addScaledVector(pr.v,h);
   if(pointSolid(pr.p)){
    if(sp_){const r=specialWorldHit(pr,h);if(r==='keep')continue;if(r==='remove'){done=true;kill(i,pr);break;}}
    done=true;if(mode==='eggwar'&&pr.auth&&pr.kind!=='bomb'&&pr.kind!=='rocket')pieceAtHit(pr.p,pr.dmg);
    if(pr.kind==='bomb'||pr.kind==='rocket'){explosion(pr.p.x,pr.p.y,pr.p.z,pr.radius,pr.dmg,pr.kb,pr.owner,pr.auth);kill(i,pr);}
    else{pr.p.addScaledVector(pr.v,-h*.6);pr.stuck=pr.kind==='thrown'?.8:5;sfx('stick',distVol(pr.p)*.7);spark(pr.p,0xd8c7a5,5);}
    break;}
   for(const t of tg){if(t.id===pr.owner||pr.hit&&pr.hit[t.id])continue;
    let hb=null;for(const b of boxesOf(t)){if(pr.p.x>b.mn.x-.12&&pr.p.x<b.mx.x+.12&&pr.p.y>b.mn.y-.1&&pr.p.y<b.mx.y+.1&&pr.p.z>b.mn.z-.12&&pr.p.z<b.mx.z+.12){hb=b;break;}}
    if(!hb)continue;
    if(t.kind!=='barrel'&&t.kind!=='ball'&&!EGG_NOBLOOD[t.kind])blood(pr.p,t.kind==='zombie'||t.kind==='rzombie'?'#6b8a3a':'#b3261e');
    if(sp_){if(specialTargetHit(pr,t,hb.head))continue;done=true;kill(i,pr);break;}
    done=true;
    if(pr.kind==='bomb'||pr.kind==='rocket'){explosion(pr.p.x,pr.p.y,pr.p.z,pr.radius,pr.dmg,pr.kb,pr.owner,pr.auth);}
    else if(pr.auth){const d=pr.v.clone().normalize();dealDamage(t,pr.dmg*(hb.head&&pr.kind!=='thrown'?1.8:1),d,pr.kb,pr.owner,hb.head);}
    kill(i,pr);break;}
  }
  if(!done&&pr.kind==='rocket')rocketTrail(pr,dt);
  if(!done){updProjMesh(pr,dt);if(pr.life<=0||pr.p.y<-40){if(pr.ret){const e=ents.find(x=>x.id===pr.owner);if(e&&isReturner(e.w))e.ammo=1;}kill(i,pr);}}
 }
}
function launch(e,kind,model,spd,dmg,grav,kb,extra){
 const d=dirOf(e.yaw+(extra&&extra.spr?rnd(-extra.spr,extra.spr):0),e.pitch+(kind==='bomb'?.12:0)+(extra&&extra.spr?rnd(-extra.spr,extra.spr):0)).normalize();
 const right=new T.Vector3(Math.cos(e.yaw),0,-Math.sin(e.yaw));
 const o=eyeOf(e).addScaledVector(d,.5).addScaledVector(right,.18);o.y-=.08;
 const v=d.multiplyScalar(spd);if(e.v){v.x+=e.v.x*.3;v.z+=e.v.z*.3;}
 const pr=spawnProj({kind,model,p:o,v,dmg,grav,kb,owner:e.id,auth:true,radius:WD.bomb.radius,spinning:kind==='knife'&&curEra!=='arabia'&&curEra!=='rome'||kind==='thrown'||kind==='bomb'});
 if(e.me&&net==='online')myShots.push([++shotN,'p',kind,model,curEra,...[o.x,o.y,o.z,v.x,v.y,v.z].map(x=>+x.toFixed(2)),performance.now()]);
 return pr;
}

// ---------- attacks ----------
function attack(e){
 const w=e.w,wd=wdOf(w);e.lastW=w;
 if(wd.special&&!wd.melee){specialAttack(e,wd);return;}
 if(wd.gun){gunAttack(e,wd);return;}
 if(wd.melee){melee(e,wd);return;}
 if(e.ammo<=0){throwWeapon(e);return;}
 e.cd=wd.cd;e.ammo--;
 if(wd===WD.xbow){launch(e,'bolt','bolt',wd.spd,wd.dmg,wd.grav,wd.kb);sfx('xbow',e.me?1:distVol(e.p));}
 else if(w==='knife'){launch(e,'knife','knife',wd.spd,wd.dmg,wd.grav,wd.kb);sfx('throw',e.me?1:distVol(e.p));}
 else if(w==='bomb'){launch(e,'bomb','bomb',wd.spd,wd.dmg,wd.grav,wd.kb);sfx('throw',e.me?1:distVol(e.p));}
 if(e.me){vmKick=.12;}
}
function releaseBow(e){
 const wd=WD.bow;const c=clamp(e.charge/wd.charge,0,1);e.charge=0;if(e.ammo<=0)return;e.ammo--;e.cd=wd.cd;
 launch(e,'arrow','arrow',lerp(wd.spd[0],wd.spd[1],c),lerp(wd.dmg[0],wd.dmg[1],c),wd.grav,wd.kb*(.5+c));sfx('bow',e.me?1:distVol(e.p));if(e.me)vmKick=.1;
}
function throwWeapon(e){e.lastW=e.w;
 const w=e.w;if(w==='fist')return;const wd=wdOf(w);const thr=wd.thr||{dmg:25,spd:30};
 if(w==='bomb'&&e.ammo>0){attack(e);return;}
 launch(e,'thrown',w,thr.spd,thr.dmg,9,8);e.w='fist';e.ammo=0;e.cd=.35;e.charge=0;sfx('throw',e.me?1:distVol(e.p));
 if(e.me)vmKick=.1;
}
function melee(e,wd){
 e.cd=wd.cd;e.swingT=.3;if(e.me){swingVM=.3;}
 sfx(e.w==='fist'?'fist':'swing',e.me?1:distVol(e.p));if(e.w==='sword'||e.w==='spear')slashFx(e);
 if(e.me&&net==='online')myShots.push([++shotN,'s',e.w,performance.now()]);
 const o=eyeOf(e),fwd=dirOf(e.yaw,e.pitch);let any=false;
 for(const t of targets()){if(t.id===e.id)continue;if(t.box){if(meleePiece(e,wd,t,o,fwd))any=true;continue;}const c=t.pos.clone();c.y+=t.h*.7;const to=c.sub(o);const dist=to.length();if(dist>wd.range+t.r)continue;
  const ang=Math.acos(clamp(to.clone().normalize().dot(fwd),-1,1));if(ang>wd.arc&&dist>.9)continue;
  if(worldT(o,to.clone().normalize(),dist)<dist-.3)continue;
  const d=to.normalize();dealDamage(t,wd.dmg,d,wd.kb,e.id,false);any=true;if(wd.bonk){bonkFx(t.pos.clone().setY(t.pos.y+1.8));if(t.ref&&t.ref.v)t.ref.v.y=Math.max(t.ref.v.y,9);}
  if(t.kind!=='barrel'&&!EGG_NOBLOOD[t.kind])blood(t.pos.clone().setY(t.pos.y+1.2),t.kind.includes('zombie')?'#6b8a3a':'#b3261e');
  if(e.w==='sword'||e.w==='spear')spark(t.pos.clone().setY(t.pos.y+1.3),0xbfe8ff,10);}
 if(any&&e.w!=='fist'&&!wd.bonk){sfx('clang',e.me?1:distVol(e.p));}
}

// ---------- explosions, sparks, blood ----------
let fx=[];
function explosion(x,y,z,radius,dmg,kb,owner,auth){
 const c=new T.Vector3(x,y,z);sfx('boom',Math.max(.35,distVol(c)));
 explosionFx(c,radius);
 const md=cam.position.distanceTo(c);if(md<radius*3)shakeT=Math.max(shakeT,.35*(1-md/(radius*3)));
 if(!auth)return;
 for(const t of targets()){const tc=t.pos.clone();tc.y+=t.h*.5;const d=tc.distanceTo(c);if(d>radius)continue;
  if(t.kind==='barrel'){if(d<radius*.8)setTimeout(()=>explodeBarrel(t.ref,owner,true),120);continue;}
  const dir=tc.sub(c).normalize();dir.y=Math.max(dir.y,.4);const f=1-d/radius;
  dealDamage(t,dmg*(.35+.65*f),dir,kb*(.4+.6*f),owner,false);
  if(t.kind==='ent'&&t.ref.v)t.ref.v.y=Math.max(t.ref.v.y,kb*.6*f);}
}
function spark(p,color,n){if(!S.particles)return;for(let i=0;i<(n||4);i++)debris(p,'#'+new T.Color(color||0xffe08a).getHexString(),rnd(2,5),.35);}
function blood(p,color){if(!S.particles)return;for(let i=0;i<8;i++)debris(p,color,rnd(2,5),.6);}
const debGeo=new T.BoxGeometry(.07,.07,.07);
function debris(p,color,spd,life){const m=new T.Mesh(debGeo,new T.MeshBasicMaterial({color}));m.position.copy(p);scene.add(m);const v=new T.Vector3(rnd(-1,1),rnd(.2,1.2),rnd(-1,1)).normalize().multiplyScalar(spd);fx.push({m,t:life||.8,T:life||.8,v,grav:12});}
function updFx(dt){for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t-=dt;const k=Math.min(1,1-f.t/f.T);
  if(f.grow){const s=.3+f.grow*Math.pow(k,.5);f.m.scale.setScalar(s);f.m.material.opacity=Math.max(0,(f.rise?.7:.95)*(1-k));if(f.rise)f.m.position.y+=f.rise*dt;}
  if(f.v){f.v.y-=f.grav*dt;f.m.position.addScaledVector(f.v,dt);f.m.material.transparent=true;f.m.material.opacity=1-k;}
  if(f.line){f.m.material.opacity=Math.max(0,1-k);}
  if(f.upd)f.upd(f,k,dt);
  if(f.t<=0){if(f.m.parent)f.m.parent.remove(f.m);if(f.m.geometry!==debGeo&&!f.m.isSprite)f.m.geometry.dispose();f.m.material.dispose();fx.splice(i,1);}}}

function updBalls(dt){

  for(let i=0;i<n;i++){const h=dt/n;b.p.addScaledVector(b.v,h);
   for(const c of colliders){const qx=clamp(b.p.x,c.min.x,c.max.x),qy=clamp(b.p.y,c.min.y,c.max.y),qz=clamp(b.p.z,c.min.z,c.max.z);const dx=b.p.x-qx,dy=b.p.y-qy,dz=b.p.z-qz;const d2=dx*dx+dy*dy+dz*dz;
    if(d2<b.r*b.r&&d2>1e-6){const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,nz=dz/d;b.p.x+=nx*(b.r-d);b.p.y+=ny*(b.r-d);b.p.z+=nz*(b.r-d);const vn=b.v.x*nx+b.v.y*ny+b.v.z*nz;if(vn<0){const e=ny>.7?.35:.6;b.v.x-=(1+e)*vn*nx;b.v.y-=(1+e)*vn*ny;b.v.z-=(1+e)*vn*nz;}if(ny>.7){const f=Math.min(1,dt*.8);b.v.x-=b.v.x*f;b.v.z-=b.v.z*f;}}}}
  for(const e of ents){if(!e.alive)continue;const dx=b.p.x-e.p.x,dz=b.p.z-e.p.z,d=Math.hypot(dx,dz);if(d<b.r+.4&&e.p.y<b.p.y+b.r&&e.p.y+PH>b.p.y-b.r&&d>.01){const nx=dx/d,nz=dz/d;const push=Math.max(2,Math.hypot(e.v.x,e.v.z))*1.15;b.v.x+=(nx*push-b.v.x)*.5;b.v.z+=(nz*push-b.v.z)*.5;e.p.x-=nx*(b.r+.4-d)*.5;e.p.z-=nz*(b.r+.4-d)*.5;}}
  if(b.p.y<-30){b.p.set(b.home[0],b.home[1]+12,b.home[2]);b.v.set(0,0,0);}

function recordFrame(dt){if(phase!=='fight'){return;}recT+=dt;if(recT<.033)return;recT=0;const now=performance.now();
 const list=[];for(const e of ents)list.push([e.id,e.p.x,e.p.y,e.p.z,e.yaw,e.pitch,e.alive?1:0,e.w,e.v.x,e.v.z]);
 for(const k in remotes){const r=remotes[k];if(r.ok&&r.md===mode)list.push([r.id,r.rp.x,r.rp.y,r.rp.z,r.yaw,r.pitch,r.alive?1:0,r.w,r.v.x,r.v.z]);}
 frames.push({t:now,list});while(frames.length&&now-frames[0].t>3000)frames.shift();}
function startReplay(){if(!lastKill||performance.now()-lastKill.t>1800||frames.length<10)return false;const t1=lastKill.t+250,t0=t1-1900;const fr=frames.filter(f=>f.t>=t0&&f.t<=t1);if(fr.length<8)return false;
 replay={fr,i:0,t:0,dur:2.8,victim:lastKill.victim,killer:lastKill.killer};phaseT+=replay.dur;return true;}
function modelFor(id){const e=ents.find(x=>x.id===id);if(e)return ensureModel(e);const r=remotes[id];return r?r.model:null;}
function updReplay(dt){if(!replay)return false;replay.t+=dt;const k=Math.min(1,replay.t/replay.dur);const fr=replay.fr;const idx=Math.min(fr.length-1,Math.floor(k*(fr.length-1)));const f=fr[idx];
 let vp=null;for(const q of f.list){const m=modelFor(q[0]);if(!m)continue;const fake={yaw:q[4],pitch:q[5],v:{x:q[8],z:q[9]},alive:!!q[6],onG:true,w:q[7],emoteT:0,me:false,swingT:0};poseChar(m,fake,new T.Vector3(q[1],q[2],q[3]),dt*.5);m.g.visible=true;if(q[0]===replay.victim)vp=new T.Vector3(q[1],q[2],q[3]);}
 if(!vp){const q=f.list.find(q=>q[0]===replay.killer);if(q)vp=new T.Vector3(q[1],q[2],q[3]);}
 if(vp){const a=replay.t*.6+.6;cam.position.set(vp.x+Math.cos(a)*5.5,vp.y+2.4,vp.z+Math.sin(a)*5.5);cam.lookAt(vp.x,vp.y+1,vp.z);}
 if(replay.t>=replay.dur)replay=null;return true;}

// ---------- building ----------
const PIECE_N={wall:'جدار',floor:'أرضية',ramp:'درج',roof:'سقف'};const MAT_N={wood:'خشب',stone:'حجر',iron:'حديد'};const MAT_HP={wood:120,stone:240,iron:420};const MAT_TEX={wood:'wood',stone:'castle',iron:'metal'};const PIECE_COST=10;
function quantDir(yaw){const fx=-Math.sin(yaw),fz=-Math.cos(yaw);return Math.abs(fx)>Math.abs(fz)?[Math.sign(fx),0]:[0,Math.sign(fz)];}
function buildTarget(e,type){const [dx,dz]=quantDir(e.yaw);const cx=Math.floor(e.p.x/G),cz=Math.floor(e.p.z/G);let lv=Math.floor((e.p.y+.4)/LH);
 if(type==='floor'&&e.pitch>.5)lv++;if(type==='roof')return{type,cx,cz,lv,dx,dz};
 if(type==='wall')return{type,cx,cz,lv,dx,dz};return{type,cx:cx+dx,cz:cz+dz,lv,dx,dz};}
function pieceKey(t){if(t.type==='wall'){const ax=t.dx?'x':'z';const ex=t.dx>0?t.cx+1:t.dx<0?t.cx:t.cx,ez=t.dz>0?t.cz+1:t.dz<0?t.cz:t.cz;return 'w|'+ex+'|'+ez+'|'+t.lv+'|'+ax;}return ({floor:'f',ramp:'r',roof:'c'}[t.type])+'|'+t.cx+'|'+t.cz+'|'+t.lv+(t.type==='ramp'?'|'+t.dx+','+t.dz:'');}
function pieceBoxes(t){const y0=t.lv*LH;const out=[];
 if(t.type==='floor'||t.type==='roof'){const y=t.type==='roof'?y0+LH:y0;out.push([t.cx*G,y-.3,t.cz*G,t.cx*G+G,y,t.cz*G+G]);}
 else if(t.type==='wall'){if(t.dx){const x=t.dx>0?(t.cx+1)*G:t.cx*G;out.push([x-.15,y0,t.cz*G,x+.15,y0+LH,t.cz*G+G]);}else{const z=t.dz>0?(t.cz+1)*G:t.cz*G;out.push([t.cx*G,y0,z-.15,t.cx*G+G,y0+LH,z+.15]);}}
 else{const n=6;for(let i=0;i<n;i++){const top=y0+(i+1)*LH/n;const a=i*G/n,b=(i+1)*G/n;let x0,x1,z0,z1;
   if(t.dx>0){x0=t.cx*G+a;x1=t.cx*G+b;z0=t.cz*G;z1=z0+G;}else if(t.dx<0){x1=t.cx*G+G-a;x0=t.cx*G+G-b;z0=t.cz*G;z1=z0+G;}else if(t.dz>0){z0=t.cz*G+a;z1=t.cz*G+b;x0=t.cx*G;x1=x0+G;}else{z1=t.cz*G+G-a;z0=t.cz*G+G-b;x0=t.cx*G;x1=x0+G;}
   out.push([x0,y0,z0,x1,top,z1]);}}

function pieceMesh(t,mat,ghostCol){const g=new T.Group();const m=ghostCol?new T.MeshBasicMaterial({color:ghostCol,transparent:true,opacity:.35,depthWrite:false}):M(MAT_TEX[mat]);const y0=t.lv*LH;

  if(t.type==='roof'&&!ghostCol){const c=new T.Mesh(new T.ConeGeometry(G*.72,1.4,4),m);c.rotation.y=Math.PI/4;c.position.set(t.cx*G+G/2,y+.7,t.cz*G+G/2);g.add(c);}}
 else if(t.type==='wall'){const b=pieceBoxes(t)[0];const s=new T.Mesh(roundGeo(b[3]-b[0],LH-.05,b[5]-b[2],2),m);s.position.set((b[0]+b[3])/2,y0+LH/2,(b[2]+b[5])/2);g.add(s);
  if(!ghostCol){const fr=new T.Mesh(new T.BoxGeometry(b[3]-b[0]+.05,.12,b[5]-b[2]+.05),cm('#3a2a1e'));fr.position.set((b[0]+b[3])/2,y0+LH/2,(b[2]+b[5])/2);g.add(fr);}}
 else{const L=Math.hypot(G,LH);const s=new T.Mesh(roundGeo(G-.05,.25,L,2),m);const cx=t.cx*G+G/2,cz=t.cz*G+G/2;s.position.set(cx,y0+LH/2,cz);const ang=Math.atan2(LH,G);

  g.add(s);}

 if(!fromNet&&net==='online')myBd.push([++bdSeq,'-',pc.key]);}

 const inp={f:0,s:0};if(!b.alive||phase!=='fight'||b.emoteT>0)return inp;const ai=b.ai;const myT=eggTeamOf(b.id);

 return botWalk(b,ai,inp,tx,tz,dt);};
